name: deploy-web
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", ".github/workflows/deploy-web.yml"]
concurrency: { group: deploy-t3-web, cancel-in-progress: false }

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: "0" }
      - run: pnpm --filter '@t3tools/web' run typecheck
      - run: pnpm --filter '@t3tools/web' run build

      - name: ssh setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # pinned host key (no runtime ssh-keyscan)
          echo '187.127.191.239 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuoqD//odUNPhh/1upsuZ6ZSXoYotlPaNmefwIJxLgB' >> ~/.ssh/known_hosts

      - name: refuse to ship ahead of the backend it needs
        env:
          H: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS: "-o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=20"
        run: |
          # Backend before frontend is not a convention, it is a dependency: the
          # bundle reads routes and fields that only a new enough backend serves.
          # Shipping the bundle first rendered a board with nothing on it. This makes
          # the order mechanical rather than remembered.
          REQ=$(grep -v '^#' apps/web/requires-backend | tr -d '[:space:]')
          [ -n "$REQ" ] || { echo "apps/web/requires-backend is empty"; exit 1; }
          ssh $SSHOPTS "$H" "REQ=$REQ bash -s" <<'EOF'
          set -e
          if grep -qx "$REQ" /opt/foundry/releases.log 2>/dev/null; then
            echo "backend $REQ has been activated -- ok to ship"
          else
            echo "backend $REQ has never been activated on this host; deploy foundry-mvp first"
            echo "activated so far:"; tail -5 /opt/foundry/releases.log 2>/dev/null || echo "(no log)"
            exit 1
          fi
          curl -sf http://172.17.0.1:4477/api/health | grep -q '"ok":true' || { echo "backend is not healthy; not shipping onto it"; exit 1; }
          EOF
        shell: bash

      - name: ship web bundle (keep previous for rollback)
        env:
          H: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          # Long-lived sessions over this link have dropped mid-deploy and reported a
          # successful deploy as a failure. Keepalives here; the verdict is the verify step.
          SSHOPTS: "-o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=20"
        run: |
          # The link between GitHub's runners and this host drops often enough to
          # fail a deploy that has nothing wrong with it. Retry before giving up.
          for attempt in 1 2 3; do
            rsync -az --delete --timeout=120 -e "ssh $SSHOPTS" apps/web/dist/ "$H:/tmp/t3-client-new/" && break
            echo "rsync attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
            [ "$attempt" = 3 ] && exit 1
          done
          ssh $SSHOPTS "$H" bash -s <<'EOF'
          set -e
          D=/usr/lib/node_modules/t3/dist
          rm -rf "$D/client.prev"; [ -d "$D/client" ] && mv "$D/client" "$D/client.prev"
          mv /tmp/t3-client-new "$D/client"
          # No restart: t3 serves this directory from disk (verified), and restarting it
          # destroys pending agent questions ("provider callback state does not survive
          # app restarts"), killing in-flight pipeline stages mid-answer.
          echo swapped
          EOF
        shell: bash

      - name: verify (roll back if t3 is unhealthy)
        env:
          H: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS: "-o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=20"
        run: |
          ssh $SSHOPTS "$H" bash -s <<'EOF'
          set -e
          D=/usr/lib/node_modules/t3/dist
          ASSET=$(grep -o '/assets/main-[A-Za-z0-9_-]*\.js' "$D/client/index.html" | head -1)
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://172.17.0.1:4488/ && curl -sf -o /dev/null "http://172.17.0.1:4488$ASSET" && { echo "healthy — serving $ASSET"; exit 0; }
            sleep 3
          done
          echo "t3 not serving the new bundle — restoring previous client"
          rm -rf "$D/client"; mv "$D/client.prev" "$D/client"
          exit 1
          EOF
        shell: bash
